<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ED Risk Dashboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --accent: #38bdf8;
        --danger: #f97316;
        --success: #22c55e;
        --warning: #facc15;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 32px 20px 50px;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 2rem;
      }

      .upload-panel {
        background: var(--panel);
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 24px;
      }

      .file-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      label {
        display: block;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 8px;
      }

      input[type="file"] {
        width: 100%;
        background: var(--card);
        color: var(--text);
        border: 1px solid #475569;
        border-radius: 10px;
        padding: 12px;
      }

      button {
        margin-top: 18px;
        background: var(--accent);
        color: #082f49;
        border: none;
        padding: 12px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
      }

      .status {
        margin-top: 16px;
        color: var(--muted);
        min-height: 24px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat-card {
        background: var(--card);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 18px;
      }

      .stat-card .label {
        color: var(--muted);
        display: block;
        margin-bottom: 8px;
      }

      .stat-card .value {
        font-size: 1.6rem;
        font-weight: bold;
      }

      .table-wrap {
        background: var(--panel);
        border: 1px solid #334155;
        border-radius: 14px;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1200px;
      }

      th, td {
        border-bottom: 1px solid #334155;
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #0b1220;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      tr:hover {
        background: rgba(148, 163, 184, 0.06);
      }

      .pill {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: bold;
      }

      .low { background: rgba(34, 197, 94, 0.18); color: #86efac; }
      .medium { background: rgba(250, 204, 21, 0.18); color: #fde68a; }
      .high { background: rgba(249, 115, 22, 0.18); color: #fdba74; }

      .recommendation {
        font-weight: bold;
      }

      .helper {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ED Risk Dashboard</h1>

      <div class="upload-panel">
        <div class="file-grid">
          <div>
            <label for="membersFile">Members CSV</label>
            <input id="membersFile" type="file" accept=".csv" />
          </div>
          <div>
            <label for="edVisitsFile">ED Visits CSV</label>
            <input id="edVisitsFile" type="file" accept=".csv" />
          </div>
          <div>
            <label for="careFile">Care History CSV</label>
            <input id="careFile" type="file" accept=".csv" />
          </div>
        </div>

        <button id="runBtn">Run Risk Analysis</button>
        <div class="status" id="status">Waiting for CSV files...</div>
      </div>

      <div class="summary-grid">
        <div class="stat-card">
          <span class="label">Total Patients</span>
          <span class="value" id="totalPatients">0</span>
        </div>
        <div class="stat-card">
          <span class="label">High Risk</span>
          <span class="value" id="highRisk">0</span>
        </div>
        <div class="stat-card">
          <span class="label">Medium Risk</span>
          <span class="value" id="mediumRisk">0</span>
        </div>
        <div class="stat-card">
          <span class="label">Low Risk</span>
          <span class="value" id="lowRisk">0</span>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const API_URL = 'http://127.0.0.1:8001/predict-json';
      const statusEl = document.getElementById('status');
      const runBtn = document.getElementById('runBtn');
      const tableHead = document.getElementById('tableHead');
      const tableBody = document.getElementById('tableBody');

      function setStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.style.color = isError ? '#fca5a5' : '#94a3b8';
      }

      function renderSummary(rows) {
        const total = rows.length;
        const high = rows.filter(r => r.risk_category === 'High').length;
        const medium = rows.filter(r => r.risk_category === 'Medium').length;
        const low = rows.filter(r => r.risk_category === 'Low').length;

        document.getElementById('totalPatients').textContent = total;
        document.getElementById('highRisk').textContent = high;
        document.getElementById('mediumRisk').textContent = medium;
        document.getElementById('lowRisk').textContent = low;
      }

      function riskClass(value) {
        const risk = value || 'Low';
        return `<span class="pill ${risk.toLowerCase()}">${risk}</span>`;
      }

      function formatCell(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'number') {
          return Number.isInteger(value) ? value : Number(value).toFixed(2);
        }
        return value;
      }

      function renderTable(rows, columns) {
        const visibleColumns = [
          'member_id',
          'risk_probability',
          'risk_score',
          'risk_category',
          'recommended_alternative_care',
          'shap_feature_1',
          'shap_value_1',
          'shap_feature_2',
          'shap_value_2',
          'shap_feature_3',
          'shap_value_3',
          'shap_explanation_summary',
          'alternative_care_reason'
        ];

        const finalCols = visibleColumns.filter(col => columns.includes(col));

        tableHead.innerHTML = `
          <tr>
            ${finalCols.map(col => `<th>${col}</th>`).join('')}
          </tr>
        `;

        tableBody.innerHTML = rows.map(row => {
          return `
            <tr>
              ${finalCols.map(col => {
                let val = row[col];
                if (col === 'risk_category') val = riskClass(val);
                else if (col === 'risk_probability' || col === 'risk_score') val = Number(val).toFixed(2);
                else if (col === 'recommended_alternative_care') val = `<span class="recommendation">${val || ''}</span>`;
                return `<td>${val ?? ''}</td>`;
              }).join('')}
            </tr>
          `;
        }).join('');
      }

      runBtn.addEventListener('click', async () => {
        const membersFile = document.getElementById('membersFile').files[0];
        const edFile = document.getElementById('edVisitsFile').files[0];
        const careFile = document.getElementById('careFile').files[0];

        if (!membersFile || !edFile || !careFile) {
          setStatus('Please upload all 3 CSV files.', true);
          return;
        }

        setStatus('Uploading files and running model...');

        const formData = new FormData();
        formData.append('members_file', membersFile);
        formData.append('ed_visits_file', edFile);
        formData.append('care_file', careFile);

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            body: formData,
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || 'Prediction failed');
          }

          const data = await response.json();
          const rows = data.rows || [];
          const columns = data.columns || [];

          renderSummary(rows);
          renderTable(rows, columns);
          setStatus(`Success: ${rows.length} patients processed.`);
        } catch (error) {
          setStatus(error.message || 'Something went wrong', true);
        }
      });
    </script>
  </body>
</html>
